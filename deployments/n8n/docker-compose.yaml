services:
  n8n:
    image: n8nio/n8n:3.4.1
    restart: always
    ports:
      - "5678:5678"
    env_file:
      - .env
    volumes:
      - ./config/data:/home/node/.n8n
      - ./config/files:/files
    depends_on:
      - postgres
  # External task runner (Code nodes); tag must match n8nio/n8n
  task-runners:
    image: n8nio/runners:3.4.1
    restart: always
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    depends_on:
      - n8n
  postgres:
    image: postgres:17
    restart: always
    env_file:
      - .env
    volumes:
      - ./config/postgres-data:/var/lib/postgresql/data
      